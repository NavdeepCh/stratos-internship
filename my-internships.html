<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>My Internships | Stratos Virtual Internships</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#171b19; --muted:#6b716c; --green:#c9f36a; --paper:#f5f5f0; --line:#d9ddd5; }
    body { margin:0; font-family:"DM Sans",sans-serif; color:var(--ink); background:var(--paper); }
    h1,h2,h3 { font-family:"Manrope",sans-serif; letter-spacing:-.04em; }
  </style>
</head>
<body>
  <header class="bg-white border-b border-[var(--line)] h-20 px-6 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3"><img src="/stratos-logo.svg" alt="" class="w-12 h-12 rounded-xl"><span class="font-black">STRATOS</span></a>
    <button id="signOut" class="border border-[var(--line)] px-4 py-2 text-xs font-bold rounded">Sign Out</button>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-12">
    <h1 class="text-4xl font-black mb-2">My Internships</h1>
    <p id="welcome" class="text-[var(--muted)] mb-10">Loading your internships...</p>
    <div id="enrollmentGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>
  <script type="module">
    import { requireStudent, signOutStudent } from "/js/auth.js";
    import { getStudentEnrollments } from "/js/enrollment-service.js";
    document.querySelector("#signOut").addEventListener("click",signOutStudent);
    requireStudent(async(user)=>{
      document.querySelector("#welcome").textContent=`Welcome back, ${user.displayName||user.email}`;
      const enrollments=await getStudentEnrollments(user);
      const grid=document.querySelector("#enrollmentGrid");
      grid.innerHTML=enrollments.length?enrollments.map((item)=>`
        <a href="/my-internships/${encodeURIComponent(item.registrationId)}" class="block bg-white border border-[var(--line)] rounded-2xl p-6 hover:border-[var(--ink)]">
          <h2 class="text-xl font-black">${item.track||"Internship"}</h2>
          <p class="text-xs text-[var(--muted)] mt-2">${item.category||"Internship"} · ${item.registrationId}</p>
          <div class="mt-5 text-xs space-y-2"><p><strong>Payment:</strong> ${item.paymentStatus||"PENDING"}</p><p><strong>Project:</strong> ${item.projectStatus||"REGISTERED"}</p></div>
        </a>`).join(""):`<p class="text-sm text-[var(--muted)]">No verified internships are linked to this account yet.</p>`;
    });
  </script>
</body>
</html>
