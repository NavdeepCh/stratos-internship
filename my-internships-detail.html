<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Internship Details | Stratos Virtual Internships</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#171b19; --muted:#6b716c; --green:#c9f36a; --paper:#f5f5f0; --line:#d9ddd5; }
    body { margin:0; font-family:"DM Sans",sans-serif; color:var(--ink); background:var(--paper); }
    h1,h2,h3 { font-family:"Manrope",sans-serif; letter-spacing:-.04em; }
  </style>
<link rel="icon" sizes="16x16 32x32 48x48" href="/favicon.ico"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png"><link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png"><link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"></head>
<body>
  <header class="bg-white border-b border-[var(--line)] h-20 px-6 flex items-center"><a href="/my-internships" class="flex items-center gap-3"><img src="/stratos-logo.svg" alt="" class="w-12 h-12 rounded-xl"><span class="font-black">STRATOS</span></a></header>
  <main class="max-w-5xl mx-auto px-4 py-12">
    <a href="/my-internships" class="text-sm underline">← My Internships</a>
    <section id="content" class="mt-6"></section>
  </main>
  <script type="module">
    import { requireStudent, signOutStudent } from "/js/auth.js";
    import { getEnrollment } from "/js/enrollment-service.js";
    import { getProject } from "/js/projects.js";
    requireStudent(async(user)=>{
      const parts=location.pathname.split("/").filter(Boolean);
      const id=decodeURIComponent(parts.at(-1)||"");
      const enrollment=await getEnrollment(user,id);
      if(!enrollment){document.querySelector("#content").innerHTML='<p class="text-red-700 font-bold">Internship not found or not authorized.</p>';return;}
      const project=getProject(enrollment.track);
      document.querySelector("#content").innerHTML=`
        <h1 class="text-4xl font-black">${enrollment.track||"Internship"}</h1>
        <p class="text-sm text-[var(--muted)] mt-2">${enrollment.category||"Internship"} · ${enrollment.registrationId}</p>
        <div class="grid md:grid-cols-3 gap-4 my-8">
          <div class="bg-white border border-[var(--line)] rounded-2xl p-5"><small>Payment</small><strong class="block mt-1">${enrollment.paymentStatus||"PENDING"}</strong></div>
          <div class="bg-white border border-[var(--line)] rounded-2xl p-5"><small>Project</small><strong class="block mt-1">${enrollment.projectStatus||"REGISTERED"}</strong></div>
          <div class="bg-white border border-[var(--line)] rounded-2xl p-5"><small>Certificate</small><strong class="block mt-1">${enrollment.certificateStatus||"NOT_ISSUED"}</strong></div>
        </div>
        ${project?`<article class="bg-white border border-[var(--line)] rounded-3xl p-8">
          <h2 class="text-2xl font-black">${project.title}</h2><p class="text-sm text-[var(--muted)] mt-3">${project.description}</p>
          <h3 class="font-black mt-6 mb-2">Technologies</h3><ul class="text-sm list-disc pl-5">${project.technologies.map(v=>`<li>${v}</li>`).join("")}</ul>
          <h3 class="font-black mt-6 mb-2">Deliverables</h3><ul class="text-sm list-disc pl-5">${project.deliverables.map(v=>`<li>${v}</li>`).join("")}</ul>
          <h3 class="font-black mt-6 mb-2">Evaluation criteria</h3><ul class="text-sm list-disc pl-5">${project.rubric.map(v=>`<li>${v}</li>`).join("")}</ul>
          ${enrollment.projectSubmissionUrl?`<a href="${enrollment.projectSubmissionUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex mt-8 bg-[var(--green)] px-5 py-3 rounded text-xs font-black">Submit Project</a>`:`<p class="mt-8 text-sm text-red-700">Project submission form is not configured for this enrollment.</p>`}
        </article>`:`<p class="text-sm text-red-700">A project assignment has not been configured for this track.</p>`}`;
    });
  </script>
</body>
</html>
